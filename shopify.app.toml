# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "291468f078a529c283ad1a2e1213d750"
name = "Bulk Product Uploader"
embedded = true
application_url = "https://shopify.dev/apps/default-app-home"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products: find, create and update products, variants, tags, collections and metafields
# write_files: upload product images (staged uploads)
scopes = "write_products,write_files"

[webhooks]
# Same version as apiVersion in app/shopify.server.ts
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
